name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 1) Build + testes automatizados
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências (build)
        run: npm ci

      - name: Testes automatizados (npm test)
        run: npm test

      - name: Executar o script original de migração/CRUD do EcoImpact
        run: npm run demo | tee ecoimpact_execucao_ci.log

      - name: Publicar logs de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ecoimpact
          path: ecoimpact_execucao_ci.log
          if-no-files-found: ignore

  # 2) Build da imagem Docker e push para o GitHub Container Registry
  docker-image:
    name: Imagem Docker
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (minúsculo)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Deploy automático em staging
  deploy-staging:
    name: Deploy staging
    needs: docker-image
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy + smoke test
        env:
          IMAGE: ${{ needs.docker-image.outputs.image }}:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD || 'staging-ci-password' }}
        run: ./scripts/deploy.sh staging

      - name: Logs dos containers
        if: failure()
        run: docker compose -p ecoimpact-staging logs --tail=100

  # 4) Deploy em produção (só na main; configure "Required reviewers" no
  #    environment "production" para exigir aprovação manual)
  deploy-production:
    name: Deploy produção
    needs: [docker-image, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy + smoke test
        env:
          IMAGE: ${{ needs.docker-image.outputs.image }}:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD || 'production-ci-password' }}
        run: ./scripts/deploy.sh production

      - name: Logs dos containers
        if: failure()
        run: docker compose -p ecoimpact-production logs --tail=100
